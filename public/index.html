 /* ---- actions ---- */
 function suggest(force){if(D.sugg&&!force)return;D.sugg=1;var v=D;call("GET","/suggest").then(function(j){if(D===v&&D.v==="name"){D.nm=j.name;ddraw();}},function(){if(D===v&&D.nm==null){D.nm="";ddraw();}});}
 function pinOk(a,b){if(!/^\d{4,8}$/.test(a)){D.err="PIN must be 4–8 digits.";ddraw();return false;}if(a!==b){D.ps=null;D.shake=1;D.err="Those PINs didn't match. Please choose your PIN again.";ddraw();return false;}return true;}
 function joined(j,link){setME({id:j.id,dev:j.device,tag:j.tag,name:j.name,link:link});dirty(0);meIn(j);BDt=0;loadBoard();draw();}
 function nameGo(nm){D.nm=nm;run(human().then(function(ts){return call("POST","/join",{ts:ts,data:mapData(),name:nm||undefined});}),function(j){joined(j);
  if(!D.share){dclose();toast("You're on the leaderboard as "+j.name+".");return;}
  ME.asked=1;setME(ME);D.v="pin";D.after=function(){D.v="img";makeImg();};});}
 function pinGo(a,b){if(!pinOk(a,b))return;run(call("POST","/pin",{pin:a},1),function(j){ME.link=j.link;ME.asked=1;setME(ME);meIn(j);
  if(D.v==="pin"){D.pinNew=1;D.after();}else{D.sub=null;D.ok="PIN set. Use “Copy edit link” and keep the link somewhere safe.";}});}
 function chPin(o,a,b){if(!pinOk(a,b))return;run(call("POST","/pin",{pin:a,link:ME.link,oldPin:o},1),function(j){meIn(j);D.sub=null;D.ok="PIN changed.";});}
 function relink(p){run(call("POST","/relink",{link:ME.link,pin:p},1),function(j){ME.link=j.link;setME(ME);meIn(j);D.sub=null;D.ok="New link made. Copy it again. The old one no longer works.";});}

 function makeImg(){var v=D,t=D.t;if(D.img){URL.revokeObjectURL(D.img.url);D.img=null;}D.busy=1;D.err="";ddraw();
  var ch=ME&&CFG&&!D.synced?put({data:mapData()}).then(function(j){dirty(0);meIn(j);v.synced=1;}):Promise.resolve();

 /* ---- Board tab ---- */
 function draw(){if(cur!=="board")return;var c=$("lbc");c.innerHTML="";
  if(CFG===null){c.appendChild(el("p","mu","Loading…"));return;}
  if(CFG===false){c.appendChild(el("p","mu","The leaderboard isn't available here. It needs the Travel Globe server."));return;}
  var y=el("div","you"),tx=el("div","tx");y.appendChild(tx);
  if(ME){var r=MR&&MR.ranks[bt];tx.appendChild(el("b","",ME.name));tx.appendChild(el("small","",r&&r.rank?"#"+r.rank+" of "+r.total+" on "+TN[bt]:"Color places on the "+TN[bt]+" map to get ranked"));
   y.appendChild(B("📤 Share","pr",function(){share(bt);}));var g=B("⚙️","ic",function(){dlg("me");});g.title="Your entry";g.setAttribute("aria-label","Your entry");y.appendChild(g);}
  else{tx.appendChild(el("b","","See where you rank"));tx.appendChild(el("small","","No account or email needed."));y.appendChild(B("Join","pr",function(){dlg("name",{});}));}
  c.appendChild(y);c.appendChild(seg(bt,function(t){bt=t;draw();}));
  if(!BD){c.appendChild(el("p","mu","Loading scores…"));return;}
  var b=BD[bt],my=ME&&MR&&MR.ranks[bt],rows=b.rows,tot=b.total;
  /* the board is cached for ~30 s, so put this player's fresh score into it */
  if(my){rows=rows.filter(function(r){return r.tag!==ME.tag;});tot=my.total;
   if(my.pts>0){var me={name:ME.name,tag:ME.tag,p:my.pts,n:my.n},at=0;while(at<rows.length&&(rows[at].p>me.p||rows[at].p===me.p&&rows[at].n>=me.n))at++;if(at<rows.length||rows.length<100)rows.splice(at,0,me);}}
  if(!rows.length){c.appendChild(el("p","mu ctr","Nobody is on the "+TN[bt]+" board yet."));return;}
  var ol=el("ol"),rank=0,prev=null,mine=0,li=function(k,nm,p,n,me){var x=el("li",me?"me":"");x.appendChild(el("span","","#"+k));x.appendChild(el("span","nm",nm));x.appendChild(el("span","sc",p+" pts · "+n));return x;};
  rows.forEach(function(r,i){if(r.p!==prev){rank=i+1;prev=r.p;}var m=!!ME&&r.tag===ME.tag;if(m)mine=1;ol.appendChild(li(rank,r.name,r.p,r.n,m));});
  if(ME&&!mine&&my&&my.rank){ol.appendChild(el("li","gap","⋯"));ol.appendChild(li(my.rank,ME.name,my.pts,my.n,1));}
  c.appendChild(ol);c.appendChild(el("p","ft",tot+(tot===1?" traveler":" travelers")+" · points · places visited"));}

 /* ---- card image (1080×1080): map of colored places, name, points, rank, site address ---- */
 function card(t,name,r){var W=1080,c=document.createElement("canvas");c.width=W;c.height=W;var x=c.getContext("2d");
  var F="system-ui,-apple-system,'Segoe UI',sans-serif",L=["#2a3442","#5b8def","#3fcf8e","#f7c948","#f58a42","#e5484d"];

  x.textAlign="right";x.fillText(TN[t].toUpperCase(),W-60,90);x.textAlign="left";
  x.fillStyle="#0a2236";rr(x,40,120,W-80,540,28);x.fill();
  try{drawMap(x,t,60,140,W-120,500,L);}catch(e){}
  if(name){x.fillStyle="#e6edf3";x.font="700 64px "+F;fitText(x,name,60,760,W-120);}
  x.fillStyle="#e6edf3";x.font="800 150px "+F;x.fillText(String(r.pts),56,925);var pw=x.measureText(String(r.pts)).width;
  x.fillStyle="#8b98a9";x.font="600 50px "+F;x.fillText("pts",72+pw,925);
  x.textAlign="right";if(r.rank){x.fillStyle="#f7c948";x.font="800 90px "+F;x.fillText("#"+r.rank,W-60,900);x.fillStyle="#8b98a9";x.font="500 34px "+F;x.fillText("of "+r.total+" on the leaderboard",W-60,945);}
  x.textAlign="left";x.fillStyle="#8b98a9";x.font="500 38px "+F;x.fillText(r.n+(r.n===1?" place":" places")+" visited",60,990);
  x.fillStyle="#5b8def";x.font="600 34px "+F;x.fillText(location.host+(location.pathname.length>1?location.pathname.replace(/\/index\.html$/,"/"):""),60,1045);
  var text=r.rank?"I'm #"+r.rank+" on the Travel Globe "+TN[t]+" leaderboard with "+r.pts+" pts!":"My Travel Globe "+TN[t]+" score: "+r.pts+" pts!";
  return new Promise(function(res,rej){c.toBlob(function(b){b?res({blob:b,url:URL.createObjectURL(b),text:text}):rej(new Error("Could not create the image."));},"image/png");});}
 function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
 function fitText(x,s,X,Y,w){while(x.measureText(s).width>w&&s.length>1)s=s.slice(0,-2)+"…";x.fillText(s,X,Y);}
 function drawMap(x,t,X,Y,w,h,L){var fs,pr,st=S[t];
  if(t==="world"){fs=WF.filter(function(f){return kf(f)!=="AQ"&&kf(f)!=="ATA";});pr=d3.geo.equirectangular();}
  else{var m=mk(t);if(!m)return;fs=m.f;pr=t==="us"?d3.geo.albersUsa():d3.geo.conicConformal().rotate([96,0]).center([0,62]).parallels([49,77]);}
  pr.scale(1).translate([0,0]);var b=d3.geo.path().projection(pr).bounds({type:"FeatureCollection",features:fs}),s=Math.min(w/(b[1][0]-b[0][0]),h/(b[1][1]-b[0][1]));
  pr.scale(s).translate([X+(w-s*(b[1][0]+b[0][0]))/2,Y+(h-s*(b[1][1]+b[0][1]))/2]);
  var p=d3.geo.path().projection(pr).context(x);x.lineWidth=1;x.strokeStyle="#0d1117";
  fs.forEach(function(f){x.beginPath();p(f);x.fillStyle=L[st[kf(f)]||0];x.fill();x.stroke();});
  if(t==="world")MKs.forEach(function(d){var v=st[d.k];if(!v)return;var q=pr([d.lon,d.lat]);if(!q)return;x.beginPath();x.arc(q[0],q[1],7,0,7);x.fillStyle=L[v];x.fill();x.strokeStyle="#e6edf3";x.lineWidth=2;x.stroke();});}
